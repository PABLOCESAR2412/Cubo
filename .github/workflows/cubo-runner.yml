name: Cubo runner
run-name: cubo:${{ inputs.execution_id }}
on:
  workflow_dispatch:
    inputs:
      execution_id:
        description: Ejecución registrada por Cubo
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: cubo-${{ inputs.execution_id }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Ejecutar y persistir
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
          CUBO_URL: ${{ vars.CUBO_URL }}
        run: node --experimental-strip-types scripts/runner-demo.ts

